server.port=8081
spring.application.name=ms-rutaexpress-envios

# ===== Base de datos H2 en memoria para pruebas unitarias e integracion =====
spring.datasource.url=jdbc:h2:mem:enviosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS USER_ENVIOS
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===== RabbitMQ =====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# ===== Apache Kafka =====
# Las pruebas por defecto no deben alcanzar el Kafka real: un puerto sin servicio hace fallar rapido cualquier publicacion accidental.
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.retries=1
spring.kafka.producer.acks=all
kafka.topic.shipments-events=shipments.events

# ===== Microservicio Catalogo =====
catalogo.service.url=http://localhost:8082

# ===== Autenticacion Interna entre Microservicios (Issue #69) =====
rutaexpress.secreto.interno=test-secreto-interno-envios-seguro-32caracteres
