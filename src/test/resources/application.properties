server.port=8081
spring.application.name=ms-rutaexpress-envios

# ===== Base de datos H2 en memoria para pruebas unitarias e integracion =====
spring.datasource.url=jdbc:h2:mem:enviosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle;INIT=CREATE SCHEMA IF NOT EXISTS USER_ENVIOS
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===== RabbitMQ =====
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false

# ===== Microservicio Catalogo =====
catalogo.service.url=http://localhost:8082
