spring.application.name=ms-rutaexpress-envios

# ===== Conexion Oracle Cloud (Autonomous DB con Wallet) =====
spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_ENVIOS_USERNAME}
spring.datasource.password=${ORACLE_ENVIOS_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Ubicacion del wallet
oracle.net.tns_admin=${ORACLE_WALLET_LOCATION}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${ORACLE_WALLET_LOCATION}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== RabbitMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ===== Apache Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all

# Topicos Kafka
kafka.topic.shipments-events=${KAFKA_TOPIC_SHIPMENTS_EVENTS:shipments.events}

# ===== Microservicio Catalogo =====
catalogo.service.url=${CATALOGO_SERVICE_URL:http://localhost:8082}

# ===== Autenticacion Interna entre Microservicios (Issue #69) =====
rutaexpress.secreto.interno=${RUTAEXPRESS_SECRETO_INTERNO:}
